<html lang="ja">

  <style>
:root {
  --color-paper: oklch(97% 0.012 95);
  --color-surface: oklch(99% 0.004 95);
  --color-paper-2: oklch(94% 0.016 95);
  --color-ink: oklch(25% 0.028 245);
  --color-muted: oklch(46% 0.025 245);
  --color-rule: oklch(85% 0.018 95);
  --color-accent: oklch(87% 0.17 95);
  --color-accent-ink: var(--color-ink);
  --color-accent-deep: oklch(71% 0.145 95);
  --color-accent-hover: oklch(90% 0.16 95);
  --color-cyan: oklch(57% 0.115 225);
  --color-cyan-soft: oklch(94% 0.035 225);
  --color-coral: oklch(55% 0.19 25);
  --color-coral-soft: oklch(96% 0.023 25);
  --color-mint: oklch(94% 0.035 155);
  --color-green: oklch(39% 0.095 155);
  --color-focus: oklch(46% 0.15 245);
  --color-shadow: oklch(25% 0.028 245 / 0.08);
  --color-transparent: oklch(97% 0.012 95 / 0);
  --font-display: 'Trebuchet MS', 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif;
  --font-body: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', Meiryo, sans-serif;
  --space-2xs: .25rem;
  --space-xs: .5rem;
  --space-sm: .75rem;
  --space-md: 1rem;
  --space-lg: 1.5rem;
  --space-xl: 2.5rem;
  --space-2xl: 4rem;
  --text-sm: .8125rem;
  --text-body: 1rem;
  --text-lg: 1.25rem;
  --text-display: clamp(1.8rem, 3vw, 2.75rem);
  --radius-card: 24px;
  --radius-input: 12px;
  --radius-pill: 999px;
  --rule-thin: 1px;
  --ease-out: cubic-bezier(.16,1,.3,1);
  --ease-in: cubic-bezier(.7,0,.84,0);
  --ease-in-out: cubic-bezier(.65,0,.35,1);
  --dur-micro: 120ms;
  --dur-short: 220ms;
  --dur-long: 420ms;
}

/* Hallmark · macrostructure: Workbench · tone: playful · theme: Hum · anchor hue: pear / cyan
 * Nav: N1 (two lesson destinations) · Footer: Ft2 · enrichment: original lesson media
 * audience: elementary pupils · use: LMS speaking practice
 * Hallmark · pre-emit critique: P4 H5 E4 S5 R4 V4 */

* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); font-size: var(--text-body); line-height: 1.7; padding-bottom: env(safe-area-inset-bottom); }
button, a { -webkit-tap-highlight-color: var(--color-transparent); }
button { font: inherit; cursor: pointer; }
button, .lesson-link, .text-link { white-space: nowrap; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 4px; }
[hidden] { display: none !important; }
h1, h2, h3, p, figure { margin: 0; }
h1, h2, h3 { font-style: normal; min-width: 0; overflow-wrap: anywhere; }
h1, .english, .brand, .count, .end-title { font-family: var(--font-display); }
a { color: inherit; }
svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.shell { width: min(1184px, 100%); padding-inline: clamp(16px, 3.2vw, 40px); margin-inline: auto; }
.skip { position: absolute; top: -80px; left: 16px; background: var(--color-accent); padding: 12px; z-index: 20; }
.skip:focus { top: 8px; }
.header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-md); padding-block: var(--space-lg); }
.brand { display: flex; align-items: center; gap: var(--space-sm); font-size: 1.15rem; font-weight: 700; line-height: 1.15; }
.brand-name { display: block; font-size: 1.5rem; letter-spacing: -.06em; }
.brand-small { font-size: .7rem; font-family: var(--font-body); font-weight: 500; letter-spacing: .02em; }
.brand-mark { width: 42px; height: 38px; display: flex; justify-content: center; align-items: center; border-radius: 14px 14px 14px 4px; background: var(--color-accent); gap: 5px; transform: rotate(-5deg); }
.brand-mark i { width: 5px; height: 5px; border-radius: 50%; background: var(--color-ink); }
.brand-mark i:last-child { height: 9px; border-radius: 5px; }
.lesson-nav { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
.lesson-link { display: inline-flex; gap: var(--space-xs); align-items: center; min-height: 44px; padding: 8px 16px; border: 1px solid var(--color-rule); border-radius: var(--radius-pill); text-decoration: none; font-family: var(--font-display); font-weight: 700; font-size: .9375rem; background: var(--color-surface); }
.lesson-link[aria-current='page'] { background: var(--color-ink); border-color: var(--color-ink); color: var(--color-paper); }
.lesson-link svg { width: 18px; height: 18px; }
.page-head { padding-block: var(--space-lg); display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-md); }
.lesson-meta { color: var(--color-muted); font-size: var(--text-sm); margin-bottom: 6px; }
h1 { font-size: var(--text-display); letter-spacing: -.035em; line-height: 1.2; }
.subtitle { margin-top: 10px; color: var(--color-muted); font-size: .9375rem; }
.help { display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: .875rem; border: 0; background: none; color: var(--color-muted); padding: 4px; }
.help svg { width: 20px; }
.steps { list-style: none; padding: 0; margin: 12px 0 28px; display: flex; gap: 12px; align-items: center; }
.steps li { display: flex; gap: 8px; align-items: center; color: var(--color-muted); font-size: .875rem; font-weight: 600; }
.steps li:not(:last-child)::after { content: ''; width: clamp(16px, 5vw, 68px); height: 1px; background: var(--color-rule); margin-inline-start: 4px; }
.step-number { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--color-paper-2); border: 1px solid var(--color-rule); font-family: var(--font-display); }
.steps .current { color: var(--color-ink); }
.steps .current .step-number { background: var(--color-accent); border-color: var(--color-accent-deep); }
.steps .complete .step-number { background: var(--color-mint); border-color: var(--color-green); color: var(--color-green); }
.workbench { display: grid; gap: 28px; align-items: start; }
.media-panel { min-width: 0; background: var(--color-cyan-soft); border-radius: var(--radius-card); padding: 18px; }
.media-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
.media-label { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: .875rem; }
.media-label svg { width: 19px; }
.media-tag { font-size: .75rem; color: var(--color-muted); }
.video-wrap { position: relative; border-radius: 14px; overflow: clip; background: var(--color-surface); }
video, .scene { width: 100%; height: auto; aspect-ratio: 3/2; object-fit: contain; display: block; background: var(--color-surface); }
.scene { object-fit: contain; }
.video-cover { position: absolute; inset: 0; display: grid; place-items: center; background: var(--color-transparent); }
.play-big { display: grid; place-items: center; height: 66px; width: 66px; border-radius: 50%; background: var(--color-accent); border: 2px solid var(--color-ink); box-shadow: 0 4px 0 var(--color-ink); color: var(--color-ink); transition: transform var(--dur-micro) var(--ease-out); }
.play-big svg { width: 28px; height: 28px; margin-left: 3px; }
.media-caption { margin-top: 14px; display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: .8125rem; color: var(--color-muted); }
.small-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--color-cyan); border-radius: var(--radius-pill); background: var(--color-surface); color: var(--color-ink); padding: 8px 12px; min-height: 44px; font-size: .8125rem; font-weight: 600; }
.small-btn svg { width: 17px; height: 17px; }
.practice-panel { padding: 4px 0 0; min-width: 0; }
.prompt-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 20px; }
.role { display: inline-flex; align-items: center; gap: 6px; font-size: .8125rem; font-weight: 600; color: var(--color-cyan); }
.role svg { width: 19px; }
.count { font-size: .8125rem; color: var(--color-muted); }
h2 { font-size: 1.4375rem; line-height: 1.5; letter-spacing: -.035em; }
.instruction { color: var(--color-muted); font-size: .9375rem; margin-top: 8px; }
.target { padding: 24px 0; margin-block: 4px; }
.english { font-size: clamp(1.8rem, 3vw, 2.65rem); font-weight: 700; letter-spacing: -.03em; line-height: 1.3; overflow-wrap: anywhere; }
.meaning { margin-top: 10px; color: var(--color-muted); font-size: .875rem; }
.listen { display: inline-flex; align-items: center; gap: 7px; border: 0; border-bottom: 1px solid var(--color-cyan); padding: 6px 0; min-height: 44px; background: none; color: var(--color-cyan); font-size: .875rem; font-weight: 600; }
.listen svg { width: 20px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { --btn-face: var(--color-accent); --btn-ink: var(--color-ink); --btn-edge: var(--color-accent-deep); --btn-cast: var(--color-shadow); display: inline-flex; align-items: center; justify-content: center; gap: .5em; min-height: 54px; padding: .8rem 1.4rem; font-weight: 700; border: 0; border-radius: var(--radius-pill); color: var(--btn-ink); background: var(--btn-face); position: relative; isolation: isolate; box-shadow: 0 4px 0 0 var(--btn-edge), 0 6px 12px -3px var(--btn-cast); transform: translateY(0); transition: transform var(--dur-micro) var(--ease-out); }
.btn:active, .play-big:active { transform: translateY(3px); box-shadow: 0 1px 0 0 var(--btn-edge), 0 2px 6px -2px var(--btn-cast); }
.btn:disabled { transform: none; box-shadow: 0 4px 0 0 var(--btn-edge); }
.btn--soft { --btn-face: var(--color-paper-2); --btn-edge: var(--color-rule); }
.btn--record { min-width: 218px; }
.btn--stop { --btn-face: var(--color-coral); --btn-edge: var(--color-coral); --btn-ink: var(--color-surface); }
.btn svg { width: 22px; }
.sub-action { margin-top: 18px; }
.text-btn { border: 0; background: none; color: var(--color-muted); text-decoration: underline; text-underline-offset: 4px; padding: 8px 0; min-height: 44px; font-size: .8125rem; }
.record-note { font-size: .75rem; color: var(--color-muted); margin-top: 16px; }
.recording { display: flex; align-items: center; gap: 12px; margin-block: 20px; color: var(--color-coral); }
.record-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--color-coral); animation: breathe 1.5s var(--ease-in-out) infinite; }
.meter { display: flex; gap: 4px; align-items: center; height: 30px; }
.meter i { display: block; height: 25px; width: 4px; border-radius: 4px; background: var(--color-coral); transform: scaleY(.15); transition: transform var(--dur-micro) var(--ease-out); }
.timer { font-variant-numeric: tabular-nums; min-width: 3em; font-family: var(--font-display); }
.feedback { padding-block: 18px; border-top: 1px solid var(--color-rule); }
.feedback h3 { display: flex; align-items: center; gap: 8px; font-size: 1.0625rem; }
.feedback h3 svg { color: var(--color-green); }
.feedback p { font-size: .875rem; color: var(--color-muted); margin-top: 8px; }
.playback { width: 100%; height: 44px; margin-block: 14px; }
.sample-result { background: var(--color-mint); padding: 20px; border-radius: 16px; margin-block: 16px; }
.sample-label { display: inline-block; font-size: .75rem; font-weight: 600; color: var(--color-green); border: 1px solid var(--color-green); border-radius: 6px; padding: 1px 8px; }
.sample-stars { color: var(--color-green); font-size: 2rem; line-height: 1.3; letter-spacing: 6px; margin-top: 8px; }
.sample-result h3 { font-size: 1.125rem; margin-top: 8px; }
.sample-result p { color: var(--color-green); font-size: .8125rem; margin-top: 8px; }
.error { background: var(--color-coral-soft); color: var(--color-coral); padding: 16px; border-radius: 12px; font-size: .875rem; margin-block: 16px; }
.status { font-size: .8125rem; margin-block: 8px; color: var(--color-muted); min-height: 0; }
.status:empty { display: none; }
.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-md); border-top: 1px solid var(--color-rule); margin-top: 36px; padding-block: 20px; font-size: .75rem; color: var(--color-muted); }
.mock-label { display: inline-flex; align-items: center; gap: 6px; }
.mock-label::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--color-cyan); }
.tip { display: flex; gap: 12px; align-items: center; padding-block: 24px 0; font-size: .8125rem; color: var(--color-muted); }
.buddy { display: grid; place-items: center; background: var(--color-accent); width: 36px; height: 36px; border-radius: 12px 12px 12px 4px; flex-shrink: 0; color: var(--color-ink); font-family: var(--font-display); font-weight: 700; transform: rotate(-6deg); }
.finished { max-width: 760px; margin-inline: auto; padding-block: 20px 8px; }
.finish-hero { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; }
.finish-mark { background: var(--color-accent); width: 80px; height: 80px; border-radius: 28px; display: grid; place-items: center; flex-shrink: 0; transform: rotate(-6deg); }
.finish-mark svg { width: 44px; height: 44px; }
.end-title { font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.2; font-weight: 700; letter-spacing: -.04em; }
.finish-hero p { color: var(--color-muted); margin-top: 8px; font-size: .9375rem; }
.summary { list-style: none; padding: 0; margin: 0 0 24px; }
.summary li { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--color-rule); }
.summary .english { font-size: 1.4375rem; }
.summary-state { color: var(--color-green); font-size: .8125rem; white-space: nowrap; }
.summary .meaning { margin-top: 4px; }
dialog { color: var(--color-ink); background: var(--color-surface); border: 1px solid var(--color-rule); border-radius: 24px; width: min(520px, calc(100% - 32px)); padding: 28px; }
dialog::backdrop { background: color-mix(in oklch, var(--color-ink) 35%, var(--color-transparent)); }
dialog h2 { font-size: 1.25rem; margin-bottom: 16px; }
dialog p { font-size: .9375rem; margin-bottom: 16px; }
dialog .btn { margin-top: 8px; }
body.embedded .header { display: none; }
@keyframes breathe { 50% { opacity: .35; } }
@keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.practice-panel { animation: appear var(--dur-short) var(--ease-out); }
@media (hover:hover) {
 .btn:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 6px 0 0 var(--btn-edge), 0 12px 22px -4px var(--btn-cast); }
 .lesson-link:not([aria-current]):hover, .small-btn:hover { background: var(--color-cyan-soft); }
 .play-big:hover { transform: translateY(-2px); }
 .text-btn:hover { color: var(--color-ink); }
}
@media (min-width: 56rem) { .workbench { grid-template-columns: minmax(0, 1.18fr) minmax(0, 1fr); gap: 40px; } .practice-panel { padding-top: 10px; } }
@media (max-width: 40rem) {
 .header { padding-block: 16px; gap: 16px; }
 .brand-name { font-size: 1.25rem; }
 .brand-mark { width: 34px; height: 34px; }
 .brand-small { font-size: .625rem; }
 .lesson-nav { gap: 6px; }
 .lesson-link { font-size: .8125rem; padding: 6px 12px; }
 .lesson-link svg { display: none; }
 .page-head { padding-block: 16px 8px; align-items: flex-start; }
 .help span { display: none; }
 .help { width: 44px; justify-content: center; }
 .steps { gap: 8px; margin: 16px 0 24px; justify-content: space-between; }
 .steps li { font-size: .75rem; gap: 6px; flex-direction: column; white-space: nowrap; flex: 1; }
 .steps li:not(:last-child)::after { display: none; }
 .step-number { width: 26px; height: 26px; }
 .media-panel { padding: 12px; border-radius: 18px; }
 .media-tag { display: none; }
 .media-caption { flex-wrap: wrap; }
 .practice-panel { padding-top: 0; }
 .prompt-top { margin-bottom: 12px; }
 .target { padding-block: 20px; }
 .actions { gap: 12px; }
 .btn { font-size: .9375rem; padding-inline: 20px; }
 .btn--record { min-width: 200px; }
 .tip { align-items: flex-start; }
 .foot { margin-top: 28px; gap: 4px; align-items: flex-start; flex-direction: column; }
 .finish-hero { gap: 16px; }
 .finish-mark { width: 60px; height: 60px; border-radius: 20px; }
 .summary li { align-items: flex-start; flex-direction: column; gap: 8px; }
}
@media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

button:not(.btn):not(:disabled):active, .lesson-link:active { transform: translateY(1px); }

</style>

  }
  async function playVideo(restart = false) {
    if (state.phase === 'recording' || state.phase === 'requesting' || state.phase === 'saving') return;
    stopAudio();
    if (state.stage === 'practice' && key === 'aboutmyself') {
      state.phase = 'cue';
      renderPanel();
      if (innerWidth < 896) video.scrollIntoView({ block: 'start' });
      if (restart || video.currentTime >= lesson.prompts[state.prompt].pauseAt) video.currentTime = lesson.prompts[state.prompt].startAt;
    } else if (restart) video.currentTime = 0;
    try { await video.play(); $('video-cover').hidden = true; }
    catch { if (state.phase === 'cue') { state.phase = 'ready'; renderPanel(); } status('動画を再生できませんでした。再生ボタンをもう一度おしてね。', true); }
  }
  $('play-video').addEventListener('click', () => playVideo());
  $('replay-video').addEventListener('click', () => playVideo(true));
  video.addEventListener('play', () => {
    if (['recording', 'requesting', 'saving'].includes(state.phase)) { video.pause(); return; }
    stopAudio(); $('video-cover').hidden = true;
  });
  video.addEventListener('pause', () => {
    if (state.stage === 'watch') $('video-cover').hidden = false;
  });
  video.addEventListener('ended', () => {
    $('video-cover').hidden = false;
    if (state.stage === 'watch') { $('media-caption').textContent = 'お手本をみたら、あなたも言ってみよう。'; }
    else if (state.phase === 'cue') { state.phase = 'ready'; renderPanel(); }
  });
  video.addEventListener('error', () => status('動画を読み込めませんでした。教材フォルダのassetsを確認してください。', true));
  video.addEventListener('timeupdate', () => {
    if (state.stage === 'practice' && key === 'aboutmyself' && state.phase === 'cue' && video.currentTime >= lesson.prompts[state.prompt].pauseAt) {
      video.pause(); state.phase = 'ready'; renderPanel(); focusPanel();
      $('media-caption').textContent = 'あなたの番！ マイクをおして言ってみよう。';
    }
  });

  function renderPanel() {
    setSteps(); setMedia();
    const panel = $('practice-panel');
    if (state.stage === 'watch') {
      panel.innerHTML = `<div class="prompt-top"><span class="role">${icon(key === 'talk' ? 'chat' : 'person')}${lesson.name}</span><span class="count">${lesson.prompts.length}つのことば</span></div><h2 id="practice-heading" tabindex="-1">まずは、お手本をみよう。</h2><p class="instruction">${lesson.intro}</p><div class="target"><p class="english" lang="en">${lesson.title}</p><p class="meaning">${lesson.subtitle}</p></div><div class="actions"><button class="btn" id="start-practice">れんしゅうをはじめる${icon('arrow')}</button></div><p class="record-note">マイクを使わずに、画面の流れも体験できます。</p><div id="status" class="status" aria-live="polite"></div>`;
      $('start-practice').onclick = startPractice;
      return;
    }
    const p = lesson.prompts[state.prompt];
    const isReview = state.phase === 'review';
    const busy = ['recording', 'requesting', 'saving', 'cue'].includes(state.phase);
    panel.innerHTML = `<div class="prompt-top"><span class="role">${icon(key === 'talk' ? 'chat' : 'person')}${p.role}</span><span class="count">${state.prompt + 1} / ${lesson.prompts.length}</span></div><h2 id="practice-heading" tabindex="-1">${p.instruction}</h2><p class="instruction">${p.question ? '「お手本をきく」で、質問と答えを聞けるよ。' : 'お手本を聞いたら、あなたの番だよ。'}</p><div class="target"><p class="english" lang="en">${p.text}</p><p class="meaning">${p.meaning}</p></div><button class="listen" id="listen-model" ${busy ? 'disabled' : ''}>${icon('sound')}お手本をきく</button>
      <div id="status" class="status" aria-live="polite"></div>
      ${state.phase === 'recording' ? `<div class="recording" role="status"><span class="record-dot"></span><span>きいているよ</span><span class="meter" id="meter" aria-hidden="true">${'<i></i>'.repeat(9)}</span><span class="timer" id="timer">0:00</span></div><div class="actions"><button class="btn btn--stop" id="stop-recording">${icon('stop')}おわった</button></div><p class="record-note">言いおわったら「おわった」をおしてね。30秒で止まります。</p>` : state.phase === 'requesting' || state.phase === 'saving' ? `<p class="instruction" role="status">${state.phase === 'requesting' ? 'マイクをじゅんびしています…' : '録音をまとめています…'}</p><div class="sub-action"><button class="text-btn" id="cancel-recording">キャンセル</button></div>` : isReview ? `<div class="feedback"><h3>${icon('check')}録音できたよ。</h3><p>自分の声を聞いてみよう。</p><audio class="playback" id="my-voice" controls></audio><div class="actions"><button class="small-btn" id="retry-recording">${icon('replay')}もう一度はなす</button><button class="small-btn" id="sample-result">サンプル評価を見る</button></div></div>` : state.phase === 'sample' ? '' : `<div class="actions" style="margin-top:20px"><button class="btn btn--record" id="record" ${state.phase === 'cue' ? 'disabled' : ''}>${icon('mic')}はなしてみる</button></div><p class="record-note">${state.phase === 'cue' ? '動画の合図を待ってね。' : 'マイクをおしてから話そう。声はこのページ内だけで使うよ。'}</p><div class="sub-action"><button class="text-btn" id="skip-recording" ${state.phase === 'cue' ? 'disabled' : ''}>録音せずに体験する</button>${state.phase === 'cue' ? '<button class="text-btn" id="skip-cue" style="margin-left:16px">合図をスキップ</button>' : ''}</div>`}
      <div id="result-area"></div><div class="sub-action"><button class="text-btn" id="back">${state.prompt ? 'ひとつ前にもどる' : 'お手本にもどる'}</button></div>`;
    $('listen-model').onclick = listenModel;
    if ($('record')) $('record').onclick = record;
    if ($('stop-recording')) $('stop-recording').onclick = stopRecording;
    if ($('cancel-recording')) $('cancel-recording').onclick = () => { cancelRecording(); state.phase = 'ready'; renderPanel(); };
    if ($('skip-recording')) $('skip-recording').onclick = () => { state.phase = 'sample'; renderPanel(); showSample(); };
    if ($('skip-cue')) $('skip-cue').onclick = () => { video.pause(); state.phase = 'ready'; renderPanel(); };
    if ($('retry-recording')) $('retry-recording').onclick = record;
    if ($('sample-result')) $('sample-result').onclick = () => { stopAudio(); showSample(); };
    if (isReview && playbackUrl) { $('my-voice').src = playbackUrl; $('my-voice').onplay = stopAudio; showNext(false); }
    if (state.phase === 'sample') showSample();
    $('back').onclick = () => {
      cleanup(); revokeRecording();
      if (state.prompt > 0) { state.prompt--; state.phase = 'ready'; renderPanel(); }
      else { state.stage = 'watch'; state.phase = 'ready'; video.currentTime = 0; renderPanel(); }
      focusPanel();
    };
  }
  function startPractice() {
    cleanup(); revokeRecording();
    state.stage = 'practice'; state.prompt = 0; state.phase = 'ready';
    renderPanel(); focusPanel();
    if (key === 'aboutmyself') playVideo(true);
  }
  async function listenModel() {
    stopAudio(); video.pause(); if ($('my-voice')) $('my-voice').pause();
    const p = lesson.prompts[state.prompt], button = $('listen-model');
    button.disabled = true; button.innerHTML = icon('sound') + 'お手本を再生中';
    const generation = spokenGeneration;
    try {
      if (p.questionAudio) await playFile(p.questionAudio, generation);
      if (generation !== spokenGeneration) return;
      if (p.audio) await playFile(p.audio, generation);
      else await speak(p.spoken, generation);
    } catch { if (generation === spokenGeneration) status('お手本の音声を再生できませんでした。もう一度おしてね。', true); }
    finally { if (generation === spokenGeneration && $('listen-model')) { $('listen-model').disabled = false; $('listen-model').innerHTML = icon('sound') + 'お手本をきく'; } }
  }
  function playFile(src, generation) {
    return new Promise((resolve, reject) => {
      if (generation !== spokenGeneration) return resolve();
      audio = new Audio(src);
      audio.onended = resolve; audio.onerror = reject;
      audio.play().catch(reject);
    });
  }
  function speak(text, generation) {
    return new Promise((resolve, reject) => {
      if (generation !== spokenGeneration) return resolve();
      if (!('speechSynthesis' in window)) return reject(new Error('No speech synthesis'));
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US'; utterance.rate = .85;
      const voice = speechSynthesis.getVoices().find(v => v.lang === 'en-US') || speechSynthesis.getVoices().find(v => v.lang.startsWith('en'));
      if (voice) utterance.voice = voice;
      utterance.onend = resolve; utterance.onerror = reject;
      window.speechSynthesis.speak(utterance);
    });
  }
  function setupMonitor() {
    try {
      const Context = window.AudioContext || window.webkitAudioContext;
      if (!Context) return;
      audioContext = new Context();
      audioContext.resume().catch(() => {});
      const source = audioContext.createMediaStreamSource(stream), analyser = audioContext.createAnalyser();
      analyser.fftSize = 1024; source.connect(analyser);
      const data = new Uint8Array(analyser.fftSize);
      const update = () => {
        if (!audioContext || !stream) return;
        analyser.getByteTimeDomainData(data);
        let sum = 0;
        for (const value of data) sum += ((value - 128) / 128) ** 2;
        const rms = Math.sqrt(sum / data.length); recordingPeak = Math.max(recordingPeak, rms);
        if (audioContext.state === 'running') monitorAvailable = true;
        document.querySelectorAll('#meter i').forEach((bar, i) => { bar.style.transform = `scaleY(${Math.max(.12, Math.min(1, rms * 12 * (1 - Math.abs(i - 4) / 7)))})`; });
        meterFrame = requestAnimationFrame(update);
      };
      update();
    } catch { stopMonitor(); }
  }
  async function record() {
    cleanup(); revokeRecording();
   
    const generation = state.generation;
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
      state.phase = 'ready'; renderPanel();
      status('この環境では録音できません。HTTPSで開くか、Safari・Chrome・Edgeの新しいバージョンで試してね。「録音せずに体験する」でも進めます。', true); return;
    }
    state.phase = 'requesting'; renderPanel();
    try {
      const candidate = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true }, video: false });
      if (generation !== state.generation) { candidate.getTracks().forEach(track => track.stop()); return; }
      stream = candidate;
      const types = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'];
      const mimeType = types.find(type => MediaRecorder.isTypeSupported(type));
      const capture = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
      recorder = capture;
      const chunks = [];
      recordingPeak = 0; monitorAvailable = false;
      capture.ondataavailable = (event) => { if (event.data.size) chunks.push(event.data); };
      capture.onerror = () => {
        if (generation !== state.generation) return;
        cancelRecording(); state.phase = 'ready'; renderPanel(); status('録音が止まりました。マイクを確認して、もう一度はなしてね。', true);
      };
      capture.onstop = () => {
        stopMonitor(); releaseTracks(); recorder = null;
        if (generation !== state.generation) return;
        const duration = (Date.now() - recordingStarted) / 1000;
        const blob = new Blob(chunks, { type: capture.mimeType || mimeType || chunks[0]?.type || 'audio/webm' });
        state.phase = 'ready';
        if (blob.size < 100 || duration < .5) { renderPanel(); status('録音が短すぎたよ。もう一度マイクをおして話してみよう。', true); return; }
        if (monitorAvailable && recordingPeak < .003) { renderPanel(); status('声を確認できなかったよ。マイクに近づいて、もう一度話してみよう。', true); return; }
        playbackUrl = URL.createObjectURL(blob);
        state.phase = 'review'; renderPanel(); focusPanel();
        status('録音はこのページ内だけで再生できます。自動採点はしていません。');
      };
      capture.start(); recordingStarted = Date.now(); state.phase = 'recording'; renderPanel(); setupMonitor();
      timer = setInterval(() => {
        const elapsed = Math.floor((Date.now() - recordingStarted) / 1000);
        if ($('timer')) $('timer').textContent = `0:${String(elapsed).padStart(2, '0')}`;
        if (elapsed >= 30) stopRecording();
      }, 250);
      stream.getAudioTracks().forEach(track => track.addEventListener('ended', () => { if (recorder?.state === 'recording') stopRecording(); }));
    } catch (error) {
      if (generation !== state.generation) return;
      stopMonitor(); releaseTracks(); recorder = null; state.phase = 'ready'; renderPanel();
      const message = error.name === 'NotAllowedError' || error.name === 'SecurityError'
        ? 'マイクを使えませんでした。ブラウザのマイクを「許可」にしてね。LMSの中だけで使えないときは、先生に確認してね。'
        : error.name === 'NotFoundError' ? 'マイクが見つからなかったよ。マイクをつないで、もう一度試してね。'
        : error.name === 'NotReadableError' ? 'マイクを使えませんでした。ほかのアプリの録音を止めて、もう一度試してね。'
        : '録音を始められませんでした。マイクとブラウザを確認して、もう一度試してね。';
      status(message + '「録音せずに体験する」でも進めます。', true);
    }
  }
  function stopRecording() {
    if (!recorder || recorder.state !== 'recording') return;
    state.phase = 'saving'; clearInterval(timer); timer = null;
    recorder.stop(); renderPanel();
  }
  function showSample() {
    const box = $('result-area'); if (!box) return;
    box.innerHTML = `<div class="sample-result"><span class="sample-label">サンプルの評価</span><div class="sample-stars" aria-label="星3つの表示例">★★★</div><h3>いいね！ その調子。</h3><p>この星とコメントは表示例です。<br>あなたの声を採点した結果ではありません。</p></div>`;
    showNext(true);
  }
  function showNext(withSample) {
    const area = $('result-area');
    const old = $('next-prompt'); if (old) old.remove();
    const button = document.createElement('button');
    button.id = 'next-prompt'; button.className = 'btn'; button.style.marginTop = '16px';
    button.innerHTML = (state.prompt === lesson.prompts.length - 1 ? 'ふりかえる' : 'つぎのことばへ') + icon('arrow');
    button.onclick = () => nextPrompt(withSample);
    area.append(button);
  }
  function nextPrompt(withSample) {
    const recorded = Boolean(playbackUrl);
    state.results[state.prompt] = { recorded, sample: Boolean(withSample) };
    cleanup(); revokeRecording();
    if (state.prompt < lesson.prompts.length - 1) {
      state.prompt++; state.phase = 'ready'; renderPanel(); focusPanel();
      if (key === 'aboutmyself') playVideo(true);
    } else finish();
  }
  function finish() {
    state.stage = 'finish'; state.phase = 'ready'; setSteps();
    $('lesson-body').hidden = true; $('finished').hidden = false;
    const count = state.results.filter(result => result?.recorded).length;
    $('finished').innerHTML = `<div class="finish-hero"><div class="finish-mark" aria-hidden="true">${icon('star')}</div><div><h2 class="end-title" id="finish-heading" tabindex="-1" lang="en">You did it!</h2><p>今日のことばを、ふりかえろう。</p></div></div><ul class="summary">${lesson.prompts.map((p, i) => `<li><div><p class="english" lang="en">${p.text}</p><p class="meaning">${p.meaning}</p></div><span class="summary-state">${state.results[i]?.recorded ? '✓ 録音してれんしゅう' : 'サンプルで体験'}</span></li>`).join('')}</ul><p class="instruction">${count ? `${count}つのことばを録音したよ。` : '画面の流れを体験したよ。'} この体験版では、声の採点やLMSへの結果保存は行いません。</p><div class="actions" style="margin-top:24px"><button class="btn" id="restart">${icon('replay')}もう一度れんしゅう</button><button class="btn btn--soft" id="to-model">お手本にもどる</button></div>`;
    $('finish-heading').focus({ preventScroll: true });
    $('restart').onclick = () => { state.results = lesson.prompts.map(() => null); $('lesson-body').hidden = false; $('finished').hidden = true; startPractice(); };
    $('to-model').onclick = () => { state.results = lesson.prompts.map(() => null); state.stage = 'watch'; state.prompt = 0; $('lesson-body').hidden = false; $('finished').hidden = true; video.currentTime = 0; renderPanel(); focusPanel(); };
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) { stopAudio(); video.pause(); if (state.phase === 'recording') stopRecording(); else if (state.phase === 'requesting') { cancelRecording(); state.phase = 'ready'; renderPanel(); } } });
  window.addEventListener('pagehide', () => { cleanup(); revokeRecording(); });
  renderPanel();
})();

</script>
</body>
</html>
